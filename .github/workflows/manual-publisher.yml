name: Manual Factorio Mod Tool

on:
  workflow_dispatch:
    inputs:
      mod_folder_path:
        description: 'Path to the mod (folder with info.json). LEAVE BLANK to just audit/list all mods.'
        required: false
        type: string

jobs:
  process-mods:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # --- ROUTE A: Audit mode (Run if input is empty) ---
      - name: Audit and Print All Mods Status
        if: ${{ github.event.inputs.mod_folder_path == '' }}
        run: |
          echo "### 🔍 Factorio Monorepo Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "| Repo Path | Mod Name | Local Version | Portal Version | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY

          PATHS=$(find . -name "info.json" -not -path '*/.*' | sed 's|/[^/]*$||' | sed 's|^\./||')

          for path in $PATHS; do
            LOCAL_NAME=$(jq -r '.name' "$path/info.json")
            LOCAL_VERSION=$(jq -r '.version' "$path/info.json")

            # Get Portal Data
            RESPONSE=$(curl -s -o response.json -w "%{http_code}" "https://mods.factorio.com/api/mods/$LOCAL_NAME")
            
            if [ "$RESPONSE" -eq 404 ]; then
              PORTAL_VERSION="Not Uploaded"
              STATUS="🟢 New Mod (Ready to publish)"
            elif [ "$RESPONSE" -eq 200 ]; then
              PORTAL_VERSION=$(jq -r '.releases[-1].version // "0.0.0"' response.json)
              
              if [ "$LOCAL_VERSION" == "$PORTAL_VERSION" ]; then
                STATUS="⚪ Up to date"
              else
                NEWEST=$(printf "%s\n%s" "$LOCAL_VERSION" "$PORTAL_VERSION" | sort -V | tail -n1)
                if [ "$NEWEST" == "$LOCAL_VERSION" ]; then
                  STATUS="⚠️ Bumped (Ready to publish)"
                else
                  STATUS="❌ Portal is ahead"
                fi
              fi
            else
              PORTAL_VERSION="Error"
              STATUS="🔴 API Error ($RESPONSE)"
            fi

            # Append to the GitHub GUI step summary table
            echo "| \`$path\` | $LOCAL_NAME | \`v$LOCAL_VERSION\` | \`v$PORTAL_VERSION\` | $STATUS |" >> $GITHUB_STEP_SUMMARY
          done
          
          echo "Audit complete! View the table below or in the Action Summary tab."

      # --- ROUTE B: Publish mode (Run only if path is provided) ---
      - name: Validate Manual Path
        if: ${{ github.event.inputs.mod_folder_path != '' }}
        run: |
          TARGET_PATH="${{ github.event.inputs.mod_folder_path }}"
          if [ ! -f "$TARGET_PATH/info.json" ]; then
            echo "::error::Could not find info.json at '$TARGET_PATH/info.json'."
            exit 1
          fi

      - name: Parse Mod Metadata
        id: mod-info
        if: ${{ github.event.inputs.mod_folder_path != '' }}
        run: |
          TARGET_PATH="${{ github.event.inputs.mod_folder_path }}"
          MOD_NAME=$(jq -r '.name' "$TARGET_PATH/info.json")
          MOD_VERSION=$(jq -r '.version' "$TARGET_PATH/info.json")
          echo "name=$MOD_NAME" >> $GITHUB_OUTPUT
          echo "version=$MOD_VERSION" >> $GITHUB_OUTPUT

      - name: Upload to Factorio Mod Portal (Auto-detect New vs Existing)
        if: ${{ github.event.inputs.mod_folder_path != '' }}
        run: |
          MOD_NAME="${{ steps.mod-info.outputs.name }}"
          echo "Checking if $MOD_NAME already exists on the Mod Portal..."

          # Query the public API to check existence
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://mods.factorio.com/api/mods/$MOD_NAME")

          if [ "$STATUS_CODE" -eq 404 ]; then
            echo "🟢 Mod not found on portal. Directing to creation endpoint (init_publish)..."
            ENDPOINT="https://mods.factorio.com/api/v2/mods/init_publish"
          elif [ "$STATUS_CODE" -eq 200 ]; then
            echo "⚪ Mod exists. Directing to update endpoint (releases/init_upload)..."
            ENDPOINT="https://mods.factorio.com/api/v2/mods/releases/init_upload"
          else
            echo "::error::Unexpected API response ($STATUS_CODE) when looking up mod."
            exit 1
          fi

          # Step 1: Request permission to upload based on the dynamically selected endpoint
          INIT_RESPONSE=$(curl -s -X POST "$ENDPOINT" \
            -H "Authorization: Bearer ${{ secrets.FACTORIO_MODS_TOKEN }}" \
            -F "mod=$MOD_NAME")

          # Check if the initialization step threw an error
          if echo "$INIT_RESPONSE" | jq -e '.error' > /dev/null; then
            echo "::error::Initialization failed: $(echo "$INIT_RESPONSE" | jq -r '.message')"
            exit 1
          fi

          # Extract the unique, temporal AWS target string from Factorio's server response
          UPLOAD_URL=$(echo "$INIT_RESPONSE" | jq -r '.upload_url')

          echo "Streaming file payload directly to storage container..."
          
          # Step 2: Stream the file as a raw binary payload via PUT to satisfy S3 expectations
          curl -s -X PUT "$UPLOAD_URL" \
            -H "Content-Type: application/zip" \
            --data-binary "@${{ env.ZIP_PATH }}" \
            --fail-with-body

          echo "🎉 Upload transaction complete!"
