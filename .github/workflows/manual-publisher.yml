name: Manual Factorio Mod Tool

on:
  workflow_dispatch:
    inputs:
      mod_folder_path:
        description: 'Path to the mod (folder with info.json). LEAVE BLANK to just audit/list all mods.'
        required: false
        type: string

jobs:
  process-mods:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # =================================================================
      # --- ROUTE A: Audit mode (Runs automatically if input is empty) ---
      # =================================================================
      - name: Audit and Print All Mods Status
        if: ${{ github.event.inputs.mod_folder_path == '' }}
        run: |
          echo "### 🔍 Factorio Monorepo Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "| Repo Path | Mod Name | Local Version | Portal Version | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY

          PATHS=$(find . -name "info.json" -not -path '*/.*' | sed 's|/[^/]*$||' | sed 's|^\./||')

          for path in $PATHS; do
            LOCAL_NAME=$(jq -r '.name' "$path/info.json")
            LOCAL_VERSION=$(jq -r '.version' "$path/info.json")

            # Get Portal Data
            RESPONSE=$(curl -s -o response.json -w "%{http_code}" "https://mods.factorio.com/api/mods/$LOCAL_NAME")
            
            if [ "$RESPONSE" -eq 404 ]; then
              PORTAL_VERSION="Not Uploaded"
              STATUS="🟢 New Mod (Ready to publish)"
            elif [ "$RESPONSE" -eq 200 ]; then
              PORTAL_VERSION=$(jq -r '.releases[-1].version // "0.0.0"' response.json)
              
              if [ "$LOCAL_VERSION" == "$PORTAL_VERSION" ]; then
                STATUS="⚪ Up to date"
              else
                NEWEST=$(printf "%s\n%s" "$LOCAL_VERSION" "$PORTAL_VERSION" | sort -V | tail -n1)
                if [ "$NEWEST" == "$LOCAL_VERSION" ]; then
                  STATUS="⚠️ Bumped (Ready to publish)"
                else
                  STATUS="❌ Portal is ahead"
                fi
              fi
            else
              PORTAL_VERSION="Error"
              STATUS="🔴 API Error ($RESPONSE)"
            fi

            echo "| \`$path\` | $LOCAL_NAME | \`v$LOCAL_VERSION\` | \`v$PORTAL_VERSION\` | $STATUS |" >> $GITHUB_STEP_SUMMARY
          done

      # =================================================================
      # --- ROUTE B: Publish mode (Runs sequentially if path provided) --
      # =================================================================
      
      # Step 1: Validate Path
      - name: Validate Manual Path
        if: ${{ github.event.inputs.mod_folder_path != '' }}
        run: |
          TARGET_PATH="${{ github.event.inputs.mod_folder_path }}"
          if [ ! -f "$TARGET_PATH/info.json" ]; then
            echo "::error::Could not find info.json at '$TARGET_PATH/info.json'."
            exit 1
          fi

      # Step 2: Parse Metadata (Outputs are generated here)
      - name: Parse Mod Metadata
        id: mod-info
        if: ${{ github.event.inputs.mod_folder_path != '' }}
        run: |
          TARGET_PATH="${{ github.event.inputs.mod_folder_path }}"
          MOD_NAME=$(jq -r '.name' "$TARGET_PATH/info.json")
          MOD_VERSION=$(jq -r '.version' "$TARGET_PATH/info.json")
          echo "name=$MOD_NAME" >> $GITHUB_OUTPUT
          echo "version=$MOD_VERSION" >> $GITHUB_OUTPUT

      # Step 3: Package Archive (This was missing!)
      - name: Package Factorio Mod Zip
        if: ${{ github.event.inputs.mod_folder_path != '' }}
        run: |
          TARGET_PATH="${{ github.event.inputs.mod_folder_path }}"
          MOD_NAME="${{ steps.mod-info.outputs.name }}"
          MOD_VERSION="${{ steps.mod-info.outputs.version }}"
          ZIP_NAME="${MOD_NAME}_${MOD_VERSION}.zip"
          
          # Structure folder internally per Factorio mod portal spec
          mkdir -p "dist/${MOD_NAME}_${MOD_VERSION}"
          cp -r $TARGET_PATH/* "dist/${MOD_NAME}_${MOD_VERSION}/"
          
          cd dist && zip -r "../$ZIP_NAME" . && cd ..
          
          # Set the absolute file path for the next step to consume
          echo "ZIP_PATH=$(pwd)/$ZIP_NAME" >> $GITHUB_ENV

      # Step 4: Stream Payload directly using the fast API protocol
      - name: Upload to Factorio Mod Portal (Auto-detect New vs Existing)
        if: ${{ github.event.inputs.mod_folder_path != '' }}
        shell: python
        env:
          FACTORIO_MODS_TOKEN: ${{ secrets.FACTORIO_MODS_TOKEN }}
          MOD_NAME: ${{ steps.mod-info.outputs.name }}
          ZIP_PATH: ${{ env.ZIP_PATH }}
        run: |
          import os
          import sys
          import subprocess

          # Silently prepare requests dependency
          subprocess.run([sys.executable, "-m", "pip", "install", "-q", "requests"])
          import requests

          token = os.environ["FACTORIO_MODS_TOKEN"]
          mod_name = os.environ["MOD_NAME"]
          zip_path = os.environ["ZIP_PATH"]

          print(f"Verifying mod portal profile status for '{mod_name}'...")
          status_check = requests.get(f"https://mods.factorio.com/api/mods/{mod_name}")
          
          if status_check.status_code == 404:
              print("🟢 Mod entry not found. Target: init_publish (Create Mod Entry)")
              endpoint = "https://mods.factorio.com/api/v2/mods/init_publish"
          elif status_check.status_code == 200:
              print("⚪ Mod entry exists. Target: releases/init_upload (New Release version)")
              endpoint = "https://mods.factorio.com/api/v2/mods/releases/init_upload"
          else:
              print(f"::error::Unexpected API response status: {status_check.status_code}")
              sys.exit(1)

          # Handshake Authorization Phase
          print("Requesting temporary authorization vector from Factorio servers...")
          headers = {"Authorization": f"Bearer {token}"}
          init_res = requests.post(endpoint, data={"mod": mod_name}, headers=headers)
          
          if not init_res.ok:
              print(f"::error::Handshake authorization rejected: {init_res.text}")
              sys.exit(1)
              
          init_data = init_res.json()
          if "error" in init_data:
              print(f"::error::API Error: {init_data['message']}")
              sys.exit(1)

          upload_url = init_data["upload_url"]

          # Secure Binary Streaming Phase
          print("Streaming payload to cloud container storage...")
          if not os.path.exists(zip_path):
              print(f"::error::Missing distribution archive file at context target: {zip_path}")
              sys.exit(1)

          with open(zip_path, "rb") as file_stream:
              upload_res = requests.post(upload_url, files={"file": file_stream})

          if upload_res.ok:
              print("🎉 Upload transaction complete! Target updated successfully.")
          else:
              print(f"::error::Storage payload delivery failed: {upload_res.text}")
              sys.exit(1)